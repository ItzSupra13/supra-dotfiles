#kitty +kitten themes  ---  for finding new themes
include ~/.config/kitty/Cherry Midnight.conf
live_config_reload = true

font_family      CaskaydiaCove Nerd Font
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
#background_opacity 0.9
background_tint 1
enable_audio_bell no


window_margin_width 10
single_window_margin_width 0
active_border_color #e7c284
mouse_hide_wait -1.0
cursor_trail 3
cursor_trail_decay 0.1 0.3
